# Ruff

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "migrations",
    "venv",
    ".venv",
    "staticfiles",
    "media",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names, etc.)
    "I",   # isort (import sorting)
    "DJ",  # flake8-django (Django-specific checks)
]

# Rules we're intentionally not enabling yet — revisit once the base set is clean.
# Candidates for later: "UP" (pyupgrade), "B" (bugbear), "SIM" (simplify), "C90" (complexity)

ignore = [
    "E501",  # line too long — handled by the formatter, avoids double-reporting
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "F401"]  # migrations are generated, not hand-written

[tool.ruff.lint.isort]
known-first-party = ["core", "catalog", "cart", "cart_api", "legal"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# djlint

[tool.djlint]
profile = "django"
indent = 2
extension = "html"
exclude = "venv,.venv,staticfiles,media,node_modules"
max_line_length = 120
ignore = "T002,H006"